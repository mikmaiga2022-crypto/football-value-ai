# FOOTBALL VALUE AI — infrastructure locale (Phase 2)
#
# Usage :
#   docker compose up --build
#   curl http://localhost:8000/v1/health
#
# Ce fichier sert au développement et aux tests d'intégration. Il ne définit
# aucun secret réel : les valeurs par défaut sont locales et non déployables.

name: football-value-ai

x-backend-env: &backend-env
  FVA_ENVIRONMENT: ${FVA_ENVIRONMENT:-dev}
  FVA_LOG_LEVEL: ${FVA_LOG_LEVEL:-INFO}
  FVA_DATABASE_URL: postgresql+asyncpg://fva:fva@postgres:5432/fva
  FVA_REDIS_URL: redis://redis:6379/0
  FVA_CELERY_BROKER_URL: redis://redis:6379/1
  FVA_CELERY_RESULT_BACKEND: redis://redis:6379/2
  # Uniquement pour le développement local : jamais réutiliser en staging/prod.
  FVA_JWT_SECRET: ${FVA_JWT_SECRET:-dev-only-secret-change-me-32-bytes-min}
  FVA_DOCS_ENABLED: "true"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fva
      POSTGRES_PASSWORD: fva
      POSTGRES_DB: fva
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fva -d fva"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment: *backend-env
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    environment: *backend-env
    command:
      - celery
      - -A
      - app.jobs.celery_app.celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: ./backend
    environment: *backend-env
    command:
      - celery
      - -A
      - app.jobs.celery_app.celery_app
      - beat
      - --loglevel=INFO
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
